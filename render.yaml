# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys only the Express backend (server/index.js). The frontend is
# static and deploys separately via GitHub Pages (see
# .github/workflows/deploy-pages.yml) — this repo has one package.json
# shared by both, so Render's build here installs the frontend's
# dependencies too even though the backend doesn't need them. Harmless,
# just a slower/heavier build than a split frontend/backend repo would
# have; not worth restructuring the repo for at this stage.
#
# To use: Render dashboard → New + → Blueprint → select this repo. Render
# reads this file and creates the service below, prompting for the
# `sync: false` secrets (never stored in the repo) during setup.
services:
  - type: web
    name: kanoon-sathi-backend
    runtime: node
    plan: free
    region: singapore # closest Render region to ap-south-1 (Mumbai), where the AWS resources live
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET
        value: lawdocuments2026
      - key: DYNAMODB_TABLE
        value: kanoon-saathi-jobs
